# freshclam da Central de segurança do Matsu (matsu-escudo-atualizar.service):
# baixa e atualiza a lista de ameaças do ClamAV. A primeira vez são ~230 MB;
# depois, só as mudanças (poucos KB), a cada 4 horas.

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamupdate
DatabaseMirror database.clamav.net
LogSyslog yes
LogTime no
ConnectTimeout 30
ReceiveTimeout 0
Bytecode yes
# Testar a lista nova carrega tudo na memória de novo (mais ~1 GB por alguns
# segundos, que num jogo vira travada). Os arquivos da lista já vêm assinados
# pelo ClamAV e o freshclam confere a assinatura de cada um.
TestDatabases no
# Avisa o clamd (se estiver ligado) para carregar a lista nova.
NotifyClamd /usr/share/matsu/seguranca/clamd.conf
