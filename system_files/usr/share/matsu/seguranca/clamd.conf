# clamd da Central de segurança do Matsu (matsu-escudo-clamd.service).
#
# O Matsu não usa o clamd@scan do Fedora: este clamd sobe só quando o escudo
# tem arquivo para verificar e desce depois de 10 minutos parado (ele ocupa
# ~1 GB de memória com a lista de ameaças carregada). Quem abre os arquivos é o
# escudo de cada pessoa, que manda só o descritor (FILDES) ou o conteúdo
# (INSTREAM) pelo soquete: o clamd não precisa ler a pasta pessoal.

DatabaseDirectory /var/lib/clamav
LocalSocket /run/matsu-escudo/clamd.sock
# Toda conta do computador pode pedir para verificar os próprios arquivos.
LocalSocketMode 666
FixStaleSocket yes
Foreground yes

LogSyslog yes
LogTime no
LogVerbose no
ExtendedDetectionInfo yes

# Poucas linhas de trabalho: num PC de jogo o antivírus não disputa o processador.
MaxThreads 4
MaxQueue 50
MaxConnectionQueueLength 30
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60
SelfCheck 3600
# Recarregar a lista sem dobrar a memória (para a verificação por alguns segundos).
ConcurrentDatabaseReload no
ExitOnOOM yes

# Até 400 MB por arquivo (o mesmo limite do escudo).
MaxScanSize 400M
MaxFileSize 400M
StreamMaxLength 400M
MaxRecursion 16
MaxFiles 10000
TemporaryDirectory /tmp

HeuristicAlerts yes
DetectPUA no
