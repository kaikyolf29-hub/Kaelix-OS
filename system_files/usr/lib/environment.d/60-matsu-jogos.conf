# Matsu OS: o ambiente dos jogos, na sessão de cada pessoa.
#
# A sobreposição dos jogos (MangoHud) fica carregada nos jogos Vulkan (quase
# todos, inclusive os do Windows pelo Proton), mas escondida. Quem mostra é a
# Central de jogos, só enquanto um jogo está aberto (~/.config/MangoHud).
MANGOHUD=1

# Baixa latência nos jogos DirectX 9, 10 e 11 pelo Proton: o DXVK lê este
# arquivo quando o jogo abre. A Central escreve nele com o perfil do jogo
# (fica vazio quando a opção está desligada).
DXVK_CONFIG_FILE=${HOME}/.config/matsu/jogos/dxvk.conf

# Cache de shader maior: o jogo compila cada efeito uma vez e guarda; com o
# cache cheio, ele recompila e engasga de novo. O padrão do Mesa (AMD e Intel)
# é 1 GB; o da NVIDIA é bem menor e ainda é limpo sozinho.
MESA_SHADER_CACHE_MAX_SIZE=10G
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
