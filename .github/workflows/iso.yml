# Monta a ISO de instalação do Matsu OS.
#
# É um instalador de rede (cerca de 1 GB): ele usa o instalador oficial do Fedora
# e baixa a imagem assinada do Matsu direto do ghcr.io durante a instalação.
# Assim a pessoa sempre instala a versão mais nova do canal escolhido.
#
# Rodado à mão: gera a ISO do canal escolhido e deixa para baixar na página do fluxo.
# Chamado pelo "Publicar versão estável": anexa a ISO ao Release.
name: Montar ISO

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal que a ISO instala"
        type: choice
        options: [teste, estavel]
        default: teste
  workflow_call:
    inputs:
      canal:
        type: string
        required: true
      release_tag:
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  FEDORA_VERSION: "44"

jobs:
  iso:
    name: ISO ${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: matsu-os
            suffix: amd
          - image: matsu-os-nvidia
            suffix: nvidia
    steps:
      - uses: actions/checkout@v7

      - name: Preparar nomes
        env:
          CANAL: ${{ inputs.canal }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=ghcr.io/${OWNER}/${{ matrix.image }}:${CANAL}" >> "$GITHUB_ENV"
          if [ -n "$RELEASE_TAG" ]; then
            NAME="matsu-os-${RELEASE_TAG#v}-${{ matrix.suffix }}.iso"
          else
            NAME="matsu-os-${CANAL}-$(date -u +%Y%m%d)-${{ matrix.suffix }}.iso"
          fi
          echo "ISO_NAME=${NAME}" >> "$GITHUB_ENV"
          # O nome com a edição do ano (arquivo EDICAO: 27 = "Matsu 27 OS").
          echo "NOME_SISTEMA=Matsu $(tr -dc '0-9' < EDICAO) OS" >> "$GITHUB_ENV"

      - name: Baixar e conferir o instalador de rede do Fedora
        run: |
          BASE="https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VERSION}/Everything/x86_64/iso"
          LIST="$(curl -fsSL "${BASE}/")"
          ISO="$(grep -oE 'Fedora-Everything-netinst-x86_64-[0-9.-]+\.iso' <<<"$LIST" | head -1)"
          SUMS="$(grep -oE 'Fedora-Everything-[0-9.-]+-x86_64-CHECKSUM' <<<"$LIST" | head -1)"
          echo "Instalador: ${ISO}"
          curl -fL --retry 3 -o netinst.iso "${BASE}/${ISO}"
          curl -fsSL --retry 3 -o CHECKSUM "${BASE}/${SUMS}"
          # Confere a assinatura do Fedora no arquivo de somas e depois a ISO.
          curl -fsSL -o fedora.asc https://fedoraproject.org/fedora.gpg
          gpg --dearmor < fedora.asc > fedora.gpg
          gpgv --keyring ./fedora.gpg CHECKSUM
          EXPECTED="$(grep "SHA256 (${ISO})" CHECKSUM | awk '{print $NF}')"
          echo "${EXPECTED}  netinst.iso" | sha256sum -c -

      - name: Escrever o kickstart
        run: |
          sed "s|@IMAGE_REF@|${IMAGE_REF}|g" installer/matsu.ks.in > matsu.ks
          cat matsu.ks

      - name: Montar a cara do Matsu no instalador
        env:
          CANAL: ${{ inputs.canal }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # As imagens e o estilo vêm de installer/marca (visual/instalador/gerar.py).
          # O .buildstamp troca o nome "Fedora" por "Matsu 27 OS" nas telas do instalador.
          VERSAO="${RELEASE_TAG#v}"
          [ -n "$VERSAO" ] || VERSAO="$CANAL"
          rm -rf marca && cp -a installer/marca marca
          printf '%s\n' "[Main]" "Product=${NOME_SISTEMA}" "Version=${VERSAO}" "IsFinal=True" \
            "BugURL=https://github.com/${GITHUB_REPOSITORY}/issues" "Variant=Everything" > marca/.buildstamp
          cat marca/.buildstamp
          (cd marca && find . -print | cpio --quiet -o -H newc | gzip -9) > updates.img
          ls -l updates.img

      - name: Montar a ISO
        run: |
          mkdir -p out
          # O menu de boot da ISO ganha o nome do Matsu, em português e sem
          # acento (nem todo PC mostra acento nessa tela).
          cat > mkiso.sh <<EOF
          set -euo pipefail
          dnf -y install lorax xorriso isomd5sum > /dev/null
          mkksiso --ks /work/matsu.ks --updates /work/updates.img \\
            -R 'Test this media & install Fedora ${FEDORA_VERSION}' 'Conferir o pendrive e instalar o ${NOME_SISTEMA}' \\
            -R 'Install Fedora ${FEDORA_VERSION} in basic graphics mode' 'Instalar o ${NOME_SISTEMA} em modo simples' \\
            -R 'Install Fedora ${FEDORA_VERSION}' 'Instalar o ${NOME_SISTEMA}' \\
            -R 'Rescue a Fedora system' 'Consertar um sistema instalado' \\
            -R 'Troubleshooting' 'Se algo der errado' \\
            /work/netinst.iso /work/out/${ISO_NAME}
          EOF
          cat mkiso.sh
          sudo podman run --rm --privileged -v "$PWD:/work:z" \
            "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" bash /work/mkiso.sh
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          ls -lh

      - name: Ligar o KVM e instalar o QEMU
        timeout-minutes: 30
        if: matrix.suffix == 'amd'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # A rede do GitHub às vezes falha no DNS: tenta três vezes, com tempo limite.
          for tentativa in 1 2 3; do
            if timeout 600 sudo apt-get update -qq \
               && timeout 900 sudo apt-get install -y -qq -o Acquire::Retries=3 qemu-system-x86 qemu-utils ovmf > /dev/null; then
              break
            fi
            [ "$tentativa" = 3 ] && exit 1
            echo "A rede do GitHub falhou ao baixar o QEMU; tentando de novo em 30 segundos"
            sleep 30
          done

      # Liga a ISO numa máquina virtual e tira prints do menu de boot e do
      # instalador (não instala nada). Um problema aqui não segura a ISO.
      - name: Testar a ISO na máquina virtual
        if: matrix.suffix == 'amd'
        continue-on-error: true
        run: bash tests/vm/run-iso.sh "out/${ISO_NAME}" prints-iso

      - name: Guardar os prints do instalador
        if: matrix.suffix == 'amd' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-instalador
          path: prints-iso/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar os prints do instalador no ramo "prints-instalador"
        if: matrix.suffix == 'amd' && always()
        run: |
          [ -d prints-iso ] || exit 0
          cp -r prints-iso /tmp/prints-iso
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan prints-instalador
          git rm -rf --quiet . || true
          mkdir -p ultimo && cp /tmp/prints-iso/* ultimo/
          {
            echo "# Prints do instalador"
            echo
            echo "ISO: \`${ISO_NAME}\` · commit ${GITHUB_SHA::7} · $(date -u '+%d/%m/%Y %H:%M') UTC"
            echo
            for f in ultimo/*.png; do echo "### $(basename "$f" .png)"; echo "![]($f)"; echo; done
          } > README.md
          git add README.md ultimo
          git commit -q -m "Prints do instalador (${GITHUB_SHA::7})"
          git push -f origin prints-instalador

      - name: Guardar a ISO para baixar (teste)
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Anexar a ISO ao Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" out/* --clobber
