# Confere os scripts e roda os testes do comando kaelix a cada mudança.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Conferir os scripts (shellcheck)
        run: |
          shellcheck -x system_files/usr/bin/kaelix system_files/usr/libexec/kaelix/* build_files/*.sh tests/*.sh tests/vm/*.sh
      - name: Testar o comando kaelix
        run: bash tests/test_kaelix.sh
      - name: Testar a central de controle
        run: bash tests/test_central.sh
      - name: Testar o leitor do Gerenciador de tarefas
        run: python3 tests/test_tarefas.py
