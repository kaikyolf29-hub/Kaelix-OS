# Confere os scripts e roda os testes do comando matsu a cada mudança.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Conferir os scripts (shellcheck)
        run: |
          shellcheck -x system_files/usr/bin/matsu system_files/usr/libexec/matsu/* build_files/*.sh tests/*.sh tests/vm/*.sh
      - name: Testar o comando matsu
        run: bash tests/test_matsu.sh
      - name: Testar a central de controle
        run: bash tests/test_central.sh
      - name: Testar o roteiro dos apps fixados na barra
        run: node tests/test_barra_fixados.js
      - name: Testar os temas de ícones do Matsu
        run: bash tests/test_icones.sh
      - name: Testar o leitor do Gerenciador de tarefas
        run: python3 tests/test_tarefas.py
      - name: Testar o ajudante da Central de jogos
        run: python3 tests/test_jogos.py
      - name: Testar o ajudante da Loja do Matsu
        run: python3 tests/test_loja.py
      - name: Testar as novidades e o aviso de atualização
        run: python3 tests/test_novidades.py
      - name: Testar os apps do dia a dia
        run: |
          set -e
          for app in relogio calendario musica fotos blocodenotas calculadora camera notas; do
            echo "::group::$app"
            if [[ -f tests/test_$app.js ]]; then node "tests/test_$app.js"; else python3 "tests/test_$app.py"; fi
            echo "::endgroup::"
          done

  # Inventário dos ícones da imagem publicada (só quando o commit pede, com
  # "[inventario]" na mensagem): os apps do menu e as páginas das Configurações,
  # com o ícone de cada um e de qual tema ele vem.
  inventario:
    if: contains(github.event.head_commit.message, '[inventario]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apps e ícones da imagem
        run: |
          # O docker não carrega a imagem (camadas demais); o podman carrega.
          sudo podman run --rm -v "$PWD/tests/vm/inventario.sh:/inventario.sh:ro,z" \
            ghcr.io/kaikyolf29-hub/matsu-os:teste bash /inventario.sh
      - name: O que falta em português na imagem
        run: |
          sudo podman run --rm -v "$PWD/tests/vm/traducoes.sh:/traducoes.sh:ro,z" \
            ghcr.io/kaikyolf29-hub/matsu-os:teste bash /traducoes.sh
