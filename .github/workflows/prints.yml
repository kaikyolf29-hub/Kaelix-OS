# Teste automático com prints.
#
# Depois de cada imagem nova, monta um disco virtual com ela, liga numa máquina
# virtual, faz o login, abre o terminal e tira prints de cada etapa.
# Os prints ficam no ramo "prints" do repositório (pasta ultimo/) e nos Artifacts.
name: Testar e tirar prints

on:
  workflow_run:
    workflows: ["Montar imagem"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      variante:
        description: "Imagem para testar"
        type: choice
        options: [matsu-os, matsu-os-nvidia]
        default: matsu-os

permissions:
  contents: write
  packages: read

concurrency:
  group: prints
  cancel-in-progress: false

jobs:
  vm:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - name: Preparar nomes
        env:
          VARIANTE: ${{ inputs.variante || 'matsu-os' }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${VARIANTE}:teste" >> "$GITHUB_ENV"

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Ligar o KVM e instalar o QEMU
        timeout-minutes: 30
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # A rede do GitHub às vezes falha no DNS: tenta três vezes, com tempo limite.
          for tentativa in 1 2 3; do
            if timeout 600 sudo apt-get update -qq \
               && timeout 900 sudo apt-get install -y -qq -o Acquire::Retries=3 qemu-system-x86 qemu-utils ovmf > /dev/null; then
              break
            fi
            [ "$tentativa" = 3 ] && exit 1
            echo "A rede do GitHub falhou ao baixar o QEMU; tentando de novo em 30 segundos"
            sleep 30
          done
          ls -l /dev/kvm

      - name: Baixar a imagem e preparar a versão de teste
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Entra no ghcr.io com o token do próprio fluxo: assim baixa a imagem
          # mesmo que o pacote ainda esteja privado (o nome novo, matsu-os).
          echo "$TOKEN" | sudo podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          sudo podman pull "$IMAGE"
          # A imagem de verdade abre o assistente de primeiro uso do KDE (Plasma
          # Setup) para a pessoa criar a conta. No teste a conta já vem pronta,
          # então marcamos o assistente como feito para cair direto no login.
          # A tela de boas-vindas do KDE também fica de fora, para os prints
          # mostrarem a área de trabalho. Entram também apps de bandeja de
          # verdade, para provar os ícones perto do relógio.
          {
            echo "FROM $IMAGE"
            echo "RUN touch /etc/plasma-setup-done && printf '[General]\\nShouldShow=false\\nLastSeenVersion=9.0.0\\n' > /etc/xdg/plasma-welcomerc"
            # Apps de bandeja de verdade para o teste da bandeja (só na imagem de teste).
            echo "RUN dnf5 -y install --skip-unavailable copyq udiskie libnotify && dnf5 clean all"
            echo "COPY tests/vm/teste-bandeja.sh /usr/bin/matsu-teste-bandeja"
            echo "COPY tests/vm/teste-ajustes.sh /usr/bin/matsu-teste-ajustes"
            echo "COPY tests/vm/teste-janelas.sh /usr/bin/matsu-teste-janelas"
            echo "COPY tests/vm/teste-apps.sh /usr/bin/matsu-teste-apps"
            echo "COPY tests/vm/fotos-site.sh /usr/bin/matsu-fotos-site"
            # A máquina virtual manda as mensagens também para a porta serial
            # (console=ttyS0), e com isso o Plymouth mostra só texto. Este ajuste,
            # só no teste, faz ele mostrar a tela de boot do Matsu como no PC.
            echo "RUN printf 'kargs = [\"plymouth.ignore-serial-consoles\"]\\n' > /usr/lib/bootc/kargs.d/90-teste-vm.toml"
          } > Containerfile.vm
          cat Containerfile.vm
          sudo podman build -t localhost/matsu-vm:latest -f Containerfile.vm .

      - name: Montar o disco virtual (bootc-image-builder)
        run: |
          mkdir -p vm-out
          cat > vm-config.toml <<'EOF'
          [[customizations.user]]
          name = "matsu"
          password = "matsu"
          groups = ["wheel"]

          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "40 GiB"
          EOF
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/vm-config.toml:/config.toml:ro" \
            -v "$PWD/vm-out:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs \
            localhost/matsu-vm:latest
          sudo chown -R "$(id -u):$(id -g)" vm-out
          ls -lh vm-out/qcow2/

      - name: Ligar a máquina virtual e tirar os prints
        run: bash tests/vm/run-vm.sh vm-out/qcow2/disk.qcow2 prints-out

      - name: Guardar os prints (Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prints
          path: prints-out/
          retention-days: 30

      - name: Publicar os prints no ramo "prints"
        if: always()
        run: |
          [ -d prints-out ] || exit 0
          cp -r prints-out /tmp/prints
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan prints
          git rm -rf --quiet . || true
          mkdir -p ultimo && cp /tmp/prints/* ultimo/
          {
            echo "# Prints do teste automático"
            echo
            echo "Imagem: \`${IMAGE}\` · commit ${GITHUB_SHA::7} · $(date -u '+%d/%m/%Y %H:%M') UTC"
            echo
            for f in ultimo/*.png; do echo "### $(basename "$f" .png)"; echo "![]($f)"; echo; done
          } > README.md
          git add README.md ultimo
          git commit -q -m "Prints do teste automático (${GITHUB_SHA::7})"
          git push -f origin prints
